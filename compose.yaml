services:
  hammerforge:
    build:
      context: .
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
    ports:
      - "${HAMMERFORGE_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
